<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101824">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.ngrok-free.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Задачник Джарвиса</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css?v=8">
  <script src="app.js?v=8" defer></script>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <h1>Мой день</h1>
        <p id="status" role="status">Задачник Джарвиса</p>
      </div>
      <div class="top-actions">
        <button id="reload" class="quiet icon-button" aria-label="Обновить" title="Обновить">↻</button>
        <button id="show-notices" class="quiet icon-button" aria-label="Уведомления" title="Уведомления" hidden>
          <span aria-hidden="true">🔔</span><span id="notice-count" class="notice-count" hidden></span>
        </button>
        <button id="disconnect" class="quiet" hidden>Отключить</button>
      </div>
    </header>

    <section id="connection" class="panel" hidden aria-labelledby="connection-title">
      <h2 id="connection-title">Подключить Джарвиса</h2>
      <form id="connect-form">
        <label for="key">Ключ подключения с компьютера</label>
        <input id="key" type="password" required maxlength="180" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="primary">Подключить</button>
      </form>
      <p id="connect-error" class="error" role="alert"></p>
    </section>

    <section id="planner" hidden aria-label="Задачи">
      <nav class="date-controls" aria-label="Выбор даты">
        <button id="previous" class="quiet" aria-label="Предыдущий день">‹</button>
        <input id="day" type="date" aria-label="Дата задач" min="2000-01-01" max="2100-12-31">
        <button id="next" class="quiet" aria-label="Следующий день">›</button>
        <button id="today" class="quiet">Сегодня</button>
      </nav>
      <nav id="week" aria-label="Дни недели"></nav>
      <div class="sections-heading">
        <h2>Разделы</h2>
        <div class="sections-actions">
          <button id="show-workflows" class="quiet">Команды</button>
          <button id="show-categories" class="quiet" aria-label="Настроить разделы">Настроить</button>
        </div>
      </div>
      <nav id="sections" aria-label="Разделы задач"></nav>
      <div class="list-header">
        <h2 id="list-heading">Задачи</h2>
        <button id="add-task" class="primary">＋ Задача</button>
      </div>
      <p id="list-error" class="error" role="alert"></p>
      <div id="tasks"></div>
    </section>

    <dialog id="workflows" aria-labelledby="workflow-title">
      <div class="list-header">
        <h2 id="workflow-title">Команды на ПК</h2>
        <button type="button" id="close-workflows" class="quiet icon-button" aria-label="Закрыть команды">×</button>
      </div>
      <div class="workflow-actions">
        <div id="workflow-voice" class="workflow-action" hidden>
          <button id="run-voice" type="button" class="primary">Смонтировать озвучку новостей</button>
          <label for="workflow-link" class="muted">Ссылка с Яндекс Диска (если нужна конкретная)</label>
          <input id="workflow-link" type="url" maxlength="500" autocapitalize="off" autocomplete="off" spellcheck="false"
            placeholder="По умолчанию — ссылка из Telegram">
        </div>
        <button type="button" class="quiet" id="run-collect" hidden>Собрать новости</button>
      </div>
      <p id="workflow-status" class="muted" role="status"></p>
      <p id="workflow-error" class="error" role="alert"></p>
      <ul id="workflow-runs" aria-label="Последние запуски"></ul>
    </dialog>

    <dialog id="notices" aria-labelledby="notices-title">
      <div class="list-header">
        <h2 id="notices-title">Уведомления</h2>
        <button type="button" id="close-notices" class="quiet icon-button" aria-label="Закрыть уведомления">×</button>
      </div>
      <div class="notice-toolbar">
        <button id="push-toggle" class="quiet" hidden>Включить на телефоне</button>
        <button id="push-test" class="quiet" hidden>Проверить</button>
        <button id="notice-clear" class="quiet" hidden>✓ Все просмотрены</button>
      </div>
      <p id="push-status" class="muted" role="status"></p>
      <p id="notices-error" class="error" role="alert"></p>
      <div id="notice-list"></div>
    </dialog>

    <dialog id="category-editor" aria-labelledby="category-editor-title">
      <form id="category-form">
        <div class="list-header">
          <h2 id="category-editor-title">Разделы задачника</h2>
          <button type="button" id="close-categories" class="quiet icon-button" aria-label="Закрыть разделы">×</button>
        </div>
        <p id="category-offline" class="muted" role="status" hidden>Изменения доступны после подключения к Джарвису.</p>
        <fieldset id="category-fields" hidden disabled>
          <label for="category-choice">Раздел</label>
          <select id="category-choice"></select>
          <label for="category-name">Название</label>
          <input id="category-name" required maxlength="40">
          <label for="category-color">Цвет</label>
          <select id="category-color" required></select>
          <label class="step-line"><input id="category-rest" type="checkbox"> Показывать дни без задач как отдых</label>
          <label for="category-target" id="category-target-label" hidden>Перенести задачи при удалении в</label>
          <select id="category-target" hidden></select>
          <p id="category-error" class="error" role="alert"></p>
          <div class="editor-actions">
            <button id="remove-category" class="danger" type="button" hidden>Удалить раздел</button>
            <button class="primary">Сохранить</button>
          </div>
        </fieldset>
      </form>
    </dialog>

    <dialog id="editor" aria-labelledby="editor-title">
      <form id="task-form">
        <div class="list-header">
          <h2 id="editor-title">Новая задача</h2>
          <button type="button" id="close-editor" class="quiet" aria-label="Закрыть">×</button>
        </div>
        <label for="title">Название</label>
        <input id="title" required maxlength="500">
        <label for="category">Раздел</label>
        <select id="category" required></select>
        <label for="task-day">Дата</label>
        <input id="task-day" type="date" required min="2000-01-01" max="2100-12-31">
        <div class="times">
          <label>Начало <input id="start" type="time"></label>
          <label>Окончание <input id="end" type="time"></label>
        </div>
        <div class="list-header">
          <h3>Подзадачи</h3>
          <button id="add-step" type="button" class="quiet">＋ Добавить</button>
        </div>
        <div id="steps"></div>
        <p id="edit-error" class="error" role="alert"></p>
        <div class="editor-actions">
          <button id="remove-task" type="button" class="danger" hidden>Удалить</button>
          <button id="save-task" class="primary">Сохранить</button>
        </div>
      </form>
    </dialog>
    <noscript>Включи JavaScript для работы с задачником.</noscript>
  </main>
</body>
</html>
